spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartwardrobe}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8080
vision-llm:
  api-url: ${VISION_LLM_API_URL:http://localhost:8081/api/vision}
  api-key: ${VISION_LLM_API_KEY:secret}
